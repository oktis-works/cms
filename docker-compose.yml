# Infra de dev do monorepo — usada pelo `bun run dev` dos apps, pelos scripts
# e2e (scripts/e2e-api.mjs) e pela CLI (`docker compose up -d postgres redis`).
#
# O deploy real NÃO usa este arquivo: os apps entram em contêiner pelos compose
# gerados no projeto (docker-compose.infra.yml / docker-compose.app.yml — em
# infrastructure/compose/ estão os templates que a CLI copia).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: okcms
      POSTGRES_USER: okcms
      POSTGRES_PASSWORD: okcms_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okcms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

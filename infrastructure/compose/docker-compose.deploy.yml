# @oktis-works - OkCMS blue/green lanes
# Generated by the CLI. Canonical at
# infrastructure/compose/docker-compose.deploy.yml
#
# ONE FILE, TWO Docker projects. The lane is the project name:
#
#   docker compose -p okcms-blue  -f docker-compose.deploy.yml up -d --build
#   docker compose -p okcms-green -f docker-compose.deploy.yml up -d --build
#
# Containers are okcms-<lane>-<service> — the nginx upstreams point at
# those names (generated in deploy/nginx/conf.d/00-upstreams.conf).
#
# The okcms-net network is EXTERNAL (created by docker-compose.infra.yml)
# and the infra services are NOT listed here on purpose: without that,
# `down` of a lane would take the database down with the old lane.
#
# Roles (label okcms.role, read by `okcms update`):
#   edge   api/web/admin → fully replaced on each deploy (blue/green)
#   worker BullMQ queue  → NEVER blue/green; drained with SIGTERM on swap
#   data   postgres/redis→ untouchable; they live in docker-compose.infra.yml
#
# NB: a lane `down` removes CONTAINERS and NETWORKS, but never passes -v
# (`-v` would wipe the okcms-storage volume shared by blue and green, the
# one that keeps media alive across deploys).

x-app: &app
  image: okcms/app:${OKCMS_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file:
    # .env first (operator ports) — the environment below overrides
    - .env
  restart: unless-stopped
  networks: [okcms]
  environment:
    NODE_ENV: production
    DB_HOST: postgres
    REDIS_HOST: redis
  volumes:
    - ./plugins:/app/plugins
    - ./themes:/app/themes
    # media shared by both lanes: a deploy never loses files
    - storage-data:/app/.data/storage
    - cache-data:/app/.data/cache

x-api-health: &api-health
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 25s

x-web-health: &web-health
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.WEB_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 25s

x-admin-health: &admin-health
  # the admin is an Astro standalone: it serves / and has no /health endpoint
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.PORT||3011)+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  # ---------------------------------------------------------------- api
  api-blue:
    <<: *app
    container_name: okcms-api-blue
    command: ["api"]
    labels:
      okcms.role: edge
      okcms.lane: blue
      okcms.service: api
    healthcheck: *api-health

  api-green:
    <<: *app
    container_name: okcms-api-green
    command: ["api"]
    labels:
      okcms.role: edge
      okcms.lane: green
      okcms.service: api
    healthcheck: *api-health

  # ---------------------------------------------------------------- web
  web-blue:
    <<: *app
    container_name: okcms-web-blue
    command: ["web"]
    labels:
      okcms.role: edge
      okcms.lane: blue
      okcms.service: web
    healthcheck: *web-health

  web-green:
    <<: *app
    container_name: okcms-web-green
    command: ["web"]
    labels:
      okcms.role: edge
      okcms.lane: green
      okcms.service: web
    healthcheck: *web-health

  # -------------------------------------------------------------- admin
  # admin reads `PORT` (astro standalone), not `ADMIN_PORT`: a service
  # level environment replaces the merged anchor one, so the three shared
  # ones are repeated.
  admin-blue:
    <<: *app
    container_name: okcms-admin-blue
    command: ["admin"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: ${ADMIN_PORT:-3011}
    labels:
      okcms.role: edge
      okcms.lane: blue
      okcms.service: admin
    healthcheck: *admin-health

  admin-green:
    <<: *app
    container_name: okcms-admin-green
    command: ["admin"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: ${ADMIN_PORT:-3011}
    labels:
      okcms.role: edge
      okcms.lane: green
      okcms.service: admin
    healthcheck: *admin-health

  # ------------------------------------------------------------- worker
  # a queue cannot take two "ghost" instances: the worker starts only after
  # the swap and the old lane's worker drains with SIGTERM
  # (stop_grace_period) first.
  worker-blue:
    <<: *app
    container_name: okcms-worker-blue
    command: ["worker"]
    stop_grace_period: 30s
    labels:
      okcms.role: worker
      okcms.lane: blue
      okcms.service: worker

  worker-green:
    <<: *app
    container_name: okcms-worker-green
    command: ["worker"]
    stop_grace_period: 30s
    labels:
      okcms.role: worker
      okcms.lane: green
      okcms.service: worker

networks:
  okcms:
    name: okcms-net
    external: true

volumes:
  # shared between blue and green on purpose: media survives the deploy
  storage-data:
    name: okcms-storage
  cache-data:
    name: okcms-cache

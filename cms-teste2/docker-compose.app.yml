# @oktis-works - Simple container stack of OkCMS
# Generated by the CLI.
#
# One Docker project, no lanes, no swap:
#
#   docker compose -p okcms-app -f docker-compose.app.yml up -d --build
#
# Containers are okcms-api / okcms-web / okcms-admin / okcms-worker — the
# nginx upstreams (deploy/nginx/conf.d/00-upstreams.conf) point at them.
# Use `okcms deploy` to pick this mode, or blue/green for zero-downtime.
#
# Network okcms-net is EXTERNAL (created by docker-compose.infra.yml), so
# `down` of this stack never touches postgres, redis or the proxy.

x-app: &app
  image: okcms/app:${OKCMS_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  networks: [okcms]
  environment:
    NODE_ENV: production
    DB_HOST: postgres
    REDIS_HOST: redis
  volumes:
    - ./plugins:/app/plugins
    - ./themes:/app/themes
    - storage-data:/app/.data/storage
    - cache-data:/app/.data/cache

x-api-health: &api-health
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 25s

x-web-health: &web-health
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.WEB_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 25s

x-admin-health: &admin-health
  # the admin is an Astro standalone: it serves / and has no /health endpoint
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.PORT||3011)+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  api:
    <<: *app
    container_name: okcms-api
    command: ["api"]
    labels:
      okcms.role: edge
      okcms.service: api
    healthcheck: *api-health

  web:
    <<: *app
    container_name: okcms-web
    command: ["web"]
    labels:
      okcms.role: edge
      okcms.service: web
    healthcheck: *web-health

  # the admin reads `PORT` (astro standalone), not `ADMIN_PORT`: a service
  # level environment replaces the merged anchor one, so it is repeated here.
  admin:
    <<: *app
    container_name: okcms-admin
    command: ["admin"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: ${ADMIN_PORT:-3011}
      UPLOAD_DIR: /app/.data/storage
    labels:
      okcms.role: edge
      okcms.service: admin
    healthcheck: *admin-health

  worker:
    <<: *app
    container_name: okcms-worker
    command: ["worker"]
    stop_grace_period: 30s
    labels:
      okcms.role: worker
      okcms.service: worker

networks:
  okcms:
    name: okcms-net
    external: true

volumes:
  # same names as the lanes: media survives switching deploy modes
  storage-data:
    name: okcms-storage
  cache-data:
    name: okcms-cache

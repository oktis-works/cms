# @oktis-works - Shared infrastructure of the production deploy
# Generated by the CLI. Canonical at
# infrastructure/compose/docker-compose.infra.yml
#
# OWN Docker project (okcms): single postgres, redis and proxy. The
# blue/green lanes are separate projects (okcms-blue / okcms-green) that
# join this network as external — so `down` of a lane never touches the
# database.
#
#   docker compose -p okcms -f docker-compose.infra.yml up -d
name: okcms

services:
  postgres:
    image: postgres:16-alpine
    container_name: okcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-okcms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: the host can run `okcms db:migrate` and
      # `db:backup` without exposing Postgres to the network. On managed
      # production remove this block and point DB_HOST/DATABASE_URL at the
      # provider.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      # classification read by `okcms update`: data = untouchable
      okcms.role: data
    networks: [okcms]

  redis:
    image: redis:7-alpine
    container_name: okcms-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    # no published port: only what is on okcms-net can reach Redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      okcms.role: data
    networks: [okcms]

  proxy:
    image: nginx:1.27-alpine
    container_name: okcms-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    environment:
      # fed to the native nginx envsubst → writes conf.d/default.conf
      SERVER_NAME: ${SERVER_NAME:-_}
      ADMIN_SERVER_NAME: ${ADMIN_SERVER_NAME:-admin.localhost}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      # conf.d must be writable: the CLI rewrites 00-upstreams.conf on swap
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:rw
    labels:
      okcms.role: proxy
    networks: [okcms]

networks:
  okcms:
    # fixed name — the lanes declare it as external
    name: okcms-net

volumes:
  postgres-data:
    name: okcms-postgres-data
  redis-data:
    name: okcms-redis-data

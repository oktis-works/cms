name: Create Release PR

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # `gh pr create --label` aborts the whole call when the label is
      # missing, and the `|| true` below would hide the failure: no PR at
      # all. Create the label up front so the PR always opens.
      - name: Ensure release label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create release --color 5319e7 --description "Release pull request" || true

      - name: Create PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "chore(release): v${{ steps.version.outputs.version }} — release branch ${{ github.ref_name }}" \
            --body "Auto-created release PR for v${{ steps.version.outputs.version }}. Merge this PR into main, then create and push tag v${{ steps.version.outputs.version }} to trigger publish." \
            --label release || true

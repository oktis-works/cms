name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# Somente o job trigger-publish precisa de contents: write (repository-dispatch).
permissions:
  contents: read

jobs:
  # ============================================================
  # Step 1: Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      # Os testes resolvem @oktis-works/* via aliases do vitest para src/
      # (vitest.config.ts) — não dependem de dist.
      - name: Run tests
        run: bun run test:run

  # ============================================================
  # Step 2: Typecheck
  # ============================================================
  # Independente do job de testes (tsc não depende do vitest) — roda em paralelo.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      # tsc resolve @oktis-works/* via exports → dist/*.d.ts: exige build COMPLETO
      # (o build parcial de 3 pacotes falhava — types depende do dist de validation).
      - name: Build all packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

  # ============================================================
  # Step 3: Lint
  # ============================================================
  # Independente dos demais — roda em paralelo.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Lint
        run: bun run lint

  # ============================================================
  # Step 4: Trigger Publish on tag push success
  # ============================================================
  trigger-publish:
    name: Trigger Publish
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # repository-dispatch exige write
    steps:
      - name: Trigger publish workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-release
          client-payload: '{"tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'

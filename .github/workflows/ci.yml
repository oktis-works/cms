name: CI/CD Pipeline

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# Somente o job trigger-publish precisa de contents: write (repository-dispatch).
permissions:
  contents: read

jobs:
  # ============================================================
  # Step 1: Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Run tests
        run: bun run test:run

  # ============================================================
  # Step 2: Typecheck
  # ============================================================
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Build all packages
        run: bun run build
      - name: Typecheck
        run: bun run typecheck

  # ============================================================
  # Step 3: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Lint
        run: bun run lint

  # ============================================================
  # Step 4: Trigger Publish on tag push success
  # ============================================================
  trigger-publish:
    name: Trigger Publish
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write # repository-dispatch exige write
    steps:
      - name: Trigger publish workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-release
          client-payload: '{"tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'
name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop, 'release/**']

# Somente o job trigger-publish precisa de contents: write (repository-dispatch).
permissions:
  contents: read

jobs:
  # ============================================================
  # Step 1: Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Build all packages
        run: bun run build
      - name: Run tests
        run: bun run test:run
      - name: Check API plugin source drift
        run: bun run check:api-drift
      - name: Check migration and CLI audit contracts
        run: bun run audit:contracts
      - name: Check provider compatibility matrix
        run: bun run check:provider-matrix
      - name: PostgreSQL acceptance matrix
        run: bun run test:postgres
        env:
          OKCMS_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: PostgreSQL historical upgrade matrix
        timeout-minutes: 5
        run: bun run build && node packages/database/scripts/postgres-upgrade-acceptance.mjs
        env:
          OKCMS_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: MySQL and MariaDB acceptance matrix
        run: bun run build && bun run test:providers
        env:
          OKCMS_MYSQL_ACCEPTANCE_URL: mysql://root:root@127.0.0.1:3306/mysql
          OKCMS_MARIADB_ACCEPTANCE_URL: mariadb://root:root@127.0.0.1:3307/mysql

  # ============================================================
  # Step 2: Typecheck
  # ============================================================
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Build all packages
        run: bun run build
      - name: Typecheck
        run: bun run typecheck

  # ============================================================
  # Step 3: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Build all packages
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Check plugin-runtime imports (GAP-07)
        run: bun run check:plugin-runtime-imports
      - name: Check infrastructure drift (GAP-16)
        run: |
          bun scripts/sync-infrastructure.ts
          git diff --exit-code -- infrastructure/

  # ============================================================
  # Step 4: Dependency Audit (bun audit)
  # ============================================================
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Audit dependencies
        run: bun audit --audit-level=high

  # ============================================================
  # Step 5: Dry-run Publish on PR (validates publish without publishing)
  # ============================================================
  dry-run-publish:
    name: Dry-run Publish
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint, audit]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare manifests (workspace:* → versão concreta)
        run: node scripts/prepare-publish.mjs --tag "v$(node -p "require('./package.json').version")"

      - name: Dry-run npm publish (packages)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in . packages/*; do
            [ "$dir" = "." ] && pkg_path="package.json" || pkg_path="$dir/package.json"
            [ -f "$pkg_path" ] || continue
            name=$(node -p "require('./$pkg_path').name")
            version=$(node -p "require('./$pkg_path').version")
            private=$(node -p "require('./$pkg_path').private === true")
            [ "$private" = "true" ] && continue
            echo "→ DRY-RUN: $name@$version"
            if [ "$dir" = "." ]; then
              npm publish --dry-run --access public --ignore-scripts 2>&1 | head -20
            else
              (cd "$dir" && npm publish --dry-run --access public --ignore-scripts 2>&1 | head -20)
            fi
          done

      - name: Dry-run npm publish (apps)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in apps/*; do
            [ -d "$dir" ] || continue
            pkg_path="$dir/package.json"
            [ -f "$pkg_path" ] || continue
            name=$(node -p "require('./$pkg_path').name")
            version=$(node -p "require('./$pkg_path').version")
            private=$(node -p "require('./$pkg_path').private === true")
            [ "$private" = "true" ] && continue
            echo "→ DRY-RUN: $name@$version"
            (cd "$dir" && npm publish --dry-run --access public --ignore-scripts 2>&1 | head -20)
          done

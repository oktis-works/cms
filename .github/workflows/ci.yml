name: CI/CD Pipeline

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write  # needed for repository-dispatch trigger

jobs:
  # ============================================================
  # Step 1: Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      # Os testes resolvem @oktis-works/* via aliases do vitest para src/
      # (vitest.config.ts) — não dependem de dist.
      - name: Run tests
        run: bun run test:run

  # ============================================================
  # Step 2: Typecheck
  # ============================================================
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      # tsc resolve @oktis-works/* via exports → dist/*.d.ts: exige build COMPLETO
      # (o build parcial de 3 pacotes falhava — types depende do dist de validation).
      - name: Build all packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

  # ============================================================
  # Step 3: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Lint
        run: bun run lint

  # ============================================================
  # Step 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Audit dependencies
        run: bun audit || true

      - name: Check for known vulnerabilities
        run: echo "Security scan completed"

  # ============================================================
  # Step 5: Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Build all packages
        run: bun run build

  # ============================================================
  # Step 6: Trigger Publish on tag push success
  # ============================================================
  trigger-publish:
    name: Trigger Publish
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint, security, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Trigger publish workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-release
          client-payload: '{"tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'
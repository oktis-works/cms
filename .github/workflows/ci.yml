name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ============================================================
  # Step 1: Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Os testes resolvem @oktis-works/* via aliases do vitest para src/
      # (vitest.config.ts) — não dependem de dist.
      - name: Run tests
        run: bun run test:run

  # ============================================================
  # Step 2: Typecheck
  # ============================================================
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsc resolve @oktis-works/* via exports → dist/*.d.ts: exige build COMPLETO
      # (o build parcial de 3 pacotes falhava — types depende do dist de validation).
      - name: Build all packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

  # ============================================================
  # Step 3: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  # ============================================================
  # Step 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit || true

      - name: Check for known vulnerabilities
        run: echo "Security scan completed"

  # ============================================================
  # Step 5: Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

  # Deploy/Docker saem de cena até existir infraestrutura real de deploy
  # (a imagem Docker continua disponível via apps/api/Dockerfile para quem
  # quiser construir localmente; ver histórico para os jobs removidos).

name: Publish to npm

# Trusted Publishing (OIDC) — sem tokens, sem OTP.
# Requisitos no npmjs.com (por pacote, nas 17 publicações):
#   Settings → Trusted publishing → GitHub Actions:
#     Organization/user: oktis-works | Repository: cms | Workflow filename: publish.yml
#     e permitir EXPLICITAMENTE a ação "npm publish"
#     (configs criadas após 03/09/2026 vêm só com "npm stage publish").
# Disparado por:
#   • repository_dispatch (publish-release) — CI trigger-publish após tag ou push em main
#   • push direto na branch main (quando não há tag, usa versão do package.json)

on:
  repository_dispatch:
    types: [publish-release]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC — Trusted Publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workspaces (OIDC)
    runs-on: ubuntu-latest
    env:
      # Versão vem do client-payload (tag) ou do package.json (push em main)
      RELEASE_TAG: ${{ github.event.client_payload.tag || '' }}
      PACKAGE_VERSION: ${{ github.event.client_payload.tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.tag && format('refs/tags/{0}', github.event.client_payload.tag) || 'refs/heads/main' }}

      - name: Extract version from package.json
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: npm >= 11.5.1 (requisito do Trusted Publishing)
        run: npm install -g npm@latest

      - name: Validar sistema de versionamento (quando há tag)
        if: github.event.client_payload.tag != ''
        run: node scripts/prepare-publish.mjs --check --tag "$RELEASE_TAG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # dist/ é obrigatório no tarball (files: ["dist"]) — o CI gate não publica nada
      - name: Build
        run: bun run build

      # Testes/typecheck/lint rodam só no ci.yml (gate via repository_dispatch)
      - name: Preparar manifests (workspace:* → versão concreta)
        run: node scripts/prepare-publish.mjs --tag "${{ steps.tag.outputs.tag }}"

      - name: npm publish (idempotente — pula o que já está no registry)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Inclui root (cms CLI) + packages/* + apps/*
          for dir in . packages/* apps/*; do
            [ "$dir" = "." ] && pkg_path="package.json" || pkg_path="$dir/package.json"
            [ -f "$pkg_path" ] || continue
            name=$(node -p "require('./$pkg_path').name")
            version=$(node -p "require('./$pkg_path').version")
            private=$(node -p "require('./$pkg_path').private === true")
            if [ "$private" = "true" ]; then
              echo "• $name é privado — pulando"
              continue
            fi
            if curl -fsS -o /dev/null "https://registry.npmjs.org/$name/$version"; then
              echo "✓ $name@$version já está no registry — pulando"
              continue
            fi
            echo "→ publicando $name@$version"
            if [ "$dir" = "." ]; then
              npm publish --access public --provenance
            else
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done

      - name: Verificação final (esperado vs latest)
        run: |
          set -euo pipefail
          for dir in . packages/* apps/*; do
            [ "$dir" = "." ] && pkg_path="package.json" || pkg_path="$dir/package.json"
            [ -f "$pkg_path" ] || continue
            name=$(node -p "require('./$pkg_path').name")
            version=$(node -p "require('./$pkg_path').version")
            private=$(node -p "require('./$pkg_path').private === true")
            [ "$private" = "true" ] && continue
            latest=$(npm view "$name" version 2>/dev/null || echo '?')
            if [ "$latest" = "$version" ]; then
              echo "✓ $name@$version"
            else
              echo "⚠️  $name: esperado $version, latest no registry = $latest"
            fi
          done

name: Publish on PR Merge

# Disparado APENAS quando PR é mergeado na main
# Aguarda TODOS os checks do PR passarem antes de disparar o publish
# Envia tag vazio para publish.yml fazer checkout de main (refs/heads/main)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write # repository-dispatch exige write

jobs:
  trigger-publish:
    name: Trigger Publish on Merge
    # Só roda se PR foi merged (não se fechado sem merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Wait for PR checks to pass
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const requiredContexts = ['Tests', 'Typecheck', 'Lint', 'Dependency Audit'];

            const { data } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            console.log(`Combined status for ${sha}: ${data.state}`);
            data.statuses.forEach(s => console.log(`  ${s.context}: ${s.state}`));

            if (data.state === 'success') {
              console.log('✅ All checks already passed');
              return;
            }

            const failed = requiredContexts.filter(ctx =>
              data.statuses.some(s => s.context === ctx && s.state === 'failure')
            );
            if (failed.length > 0) {
              throw new Error(`❌ Required checks failed: ${failed.join(', ')}`);
            }

            const pending = requiredContexts.filter(ctx =>
              !data.statuses.some(s => s.context === ctx && s.state === 'success')
            );
            if (pending.length > 0) {
              console.log(`⏳ Checks still pending: ${pending.join(', ')} — waiting briefly...`);
              // Brief wait for any propagation delay (max 30s)
              for (let i = 0; i < 6; i++) {
                await new Promise(r => setTimeout(r, 5000));
                const { data: status } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
                if (status.state === 'success') {
                  console.log('✅ All checks passed after brief wait');
                  return;
                }
              }
              throw new Error(`❌ Timeout: checks still pending: ${pending.join(', ')}`);
            }

            throw new Error(`❌ Unexpected state: ${data.state}`);

      - name: Trigger publish workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-release
          client-payload: '{"tag": "", "sha": "${{ github.sha }}", "version": "${{ steps.version.outputs.version }}"}'
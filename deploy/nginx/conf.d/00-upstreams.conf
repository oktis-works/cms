# @oktis-works - Active upstreams (GENERATED by the CLI — do not edit by hand)
#
# Rewritten by `okcms update` at swap time and reloaded with
#   docker exec okcms-proxy nginx -s reload
# Points at containers of the Docker project okcms-<lane> on okcms-net.
# Media, cache and database are NOT blue/green — they live in the `okcms`
# project.

map $host $upstream_api {
  default http://okcms-api-blue:3000;
}

map $host $upstream_web {
  default http://okcms-web-blue:3001;
}

map $host $upstream_admin {
  default http://okcms-admin-blue:3011;
}
